<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="main">
      <div class="content">
        <h1>
          <span class="white">Generate a</span>
          <span class="green">random password</span>
        </h1>
        <p>Never use an insecure password again</p>
        <button id="generate">
          <img src="./Icon.png" alt="" />Generate Password
        </button>
        <label class="length" for="length"
          >Password Length <input min="1" type="number" id="length"
        /></label>
        <hr />
        <p id="pass1"></p>
        <p id="pass2"></p>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
